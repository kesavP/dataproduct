# Databricks Asset Bundle for the retail orders medallion pipeline.
#
# Build & deploy:
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev      # builds the wheel + creates the job
#   databricks bundle run orders_pipeline -t dev
#
# The bundle builds the poetry project into a wheel (artifacts: ...) and runs it
# as a Python wheel task. The wheel's console scripts (pyproject.toml
# [tool.poetry.scripts]) are the entry points:
#   orders_pipeline   - batch medallion job (run on demand / scheduled)
#   orders_streaming  - Auto Loader streaming job (continuous)

bundle:
  name: retail-data-product

artifacts:
  default:
    type: whl
    build: poetry build
    path: .

# Bundle-wide defaults; per-target overrides live under `targets`.
variables:
  catalog:
    description: Unity Catalog catalog for the medallion data.
    default: main
  schema:
    description: Schema/database holding the orders tables.
    default: retail
  volume_path:
    description: UC Volume base path for raw CSV inputs and Delta storage.
    default: /Volumes/main/retail/landing
  orders_path:
    description: Path to the raw orders dataset (UC Volume path or cloud URI such
      as abfss://...). A CSV file or a Parquet directory, per orders_format.
    default: /Volumes/main/retail/landing/orders.csv
  orders_format:
    description: Format of the orders dataset - "csv" or "parquet".
    default: csv
  stream_landing_dir:
    description: Directory Auto Loader watches for new order files.
    default: /Volumes/main/retail/landing/orders_stream

resources:
  jobs:
    orders_pipeline:
      name: "[${bundle.target}] orders-medallion-pipeline"
      tasks:
        - task_key: orders_medallion
          # Serverless: attach an environment instead of a job cluster.
          environment_key: default
          python_wheel_task:
            package_name: retail_data_product
            entry_point: orders_pipeline
            parameters:
              - "--orders-path=${var.orders_path}"
              - "--orders-format=${var.orders_format}"
              - "--customers-csv=${var.volume_path}/customers.csv"
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
      # On serverless, task libraries are declared via the environment's
      # dependencies (the `libraries:` field is not supported). The bundle
      # uploads the built wheel and rewrites this path on deploy. Spark + Delta
      # come from the serverless runtime, so they are not listed here.
      environments:
        - environment_key: default
          spec:
            client: "3"  # serverless env version (3 -> Python 3.12, matches pyproject)
            dependencies:
              - ./dist/*.whl

    orders_streaming:
      name: "[${bundle.target}] orders-medallion-streaming"
      # Triggered on-demand (no `continuous`, no `schedule`): each run uses Auto
      # Loader's availableNow trigger to drain all pending files once and stop.
      # Run it with: databricks bundle run orders_streaming -t dev
      tasks:
        - task_key: orders_stream
          # Serverless: attach an environment instead of a job cluster.
          environment_key: default
          python_wheel_task:
            package_name: retail_data_product
            entry_point: orders_streaming
            parameters:
              - "--landing-dir=${var.stream_landing_dir}"
              - "--orders-format=${var.orders_format}"
              - "--customers-csv=${var.volume_path}/customers.csv"
              - "--catalog=${var.catalog}"
              - "--schema=${var.schema}"
              - "--schema-location=${var.volume_path}/_schemas/orders"
              - "--checkpoint-location=${var.volume_path}/_checkpoints/orders_stream"
              - "--available-now"
      environments:
        - environment_key: default
          spec:
            client: "3"  # serverless env version (3 -> Python 3.12, matches pyproject)
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-db4dd419-f099.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://adb-XXXXXXXXXXXX.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: retail
      volume_path: /Volumes/main/retail/landing
    run_as:
      service_principal_name: REPLACE_WITH_SP_APPLICATION_ID
