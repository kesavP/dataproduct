[tool.poetry]
name = "retail-api"
version = "0.1.0"
description = "FastAPI wrapper for Databricks medallion pipeline"
authors = ["Retail Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
databricks-sql-connector = "^3.0.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
fastapi-cors = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
